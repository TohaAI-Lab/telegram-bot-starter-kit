name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify dependencies
        run: python -c "import aiogram; import dotenv; print(aiogram.__version__)"

      - name: Check Python syntax
        run: python -m compileall -q bot.py config.py database handlers middlewares services tests

      - name: Run all automated tests
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)

          if result.testsRun < 15:
              raise SystemExit("ERROR: Missing tests")

          if result.skipped:
              raise SystemExit("ERROR: Skipped tests detected")

          if not result.wasSuccessful():
              raise SystemExit(1)

          print("SUCCESS: All tests passed without skips")
          PY
